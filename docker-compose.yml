version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: weather_portal_db
    environment:
      POSTGRES_DB: weather_portal
      POSTGRES_USER: weather_user
      POSTGRES_PASSWORD: weather_pass123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - weather_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weather_portal_backend
    environment:
      DATABASE_URL: postgresql://weather_user:weather_pass123@postgres:5432/weather_portal
      SECRET_KEY: your-secret-key-change-in-production
      DEBUG: "True"
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
    networks:
      - weather_network
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: weather_portal_frontend
    environment:
      REACT_APP_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - weather_network
    command: npm start

volumes:
  postgres_data:

networks:
  weather_network:
    driver: bridge
