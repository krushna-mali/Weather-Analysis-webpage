<!DOCTYPE html>
<html>
<head>
    <title>Frontend Connection Test</title>
</head>
<body>
    <h1>Testing Frontend to Backend Connection</h1>
    <button onclick="testConnection()">Test API Connection</button>
    <button onclick="testSearch()">Test City Search</button>
    <div id="results"></div>

    <script>
        async function testConnection() {
            const results = document.getElementById('results');
            results.innerHTML = 'Testing connection...';
            
            try {
                const response = await fetch('http://127.0.0.1:8000/api/v1/health');
                const data = await response.json();
                results.innerHTML = `✅ Connection Success: ${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                results.innerHTML = `❌ Connection Failed: ${error.message}`;
            }
        }

        async function testSearch() {
            const results = document.getElementById('results');
            results.innerHTML = 'Testing search...';
            
            try {
                const response = await fetch('http://127.0.0.1:8000/api/v1/geocode?q=mumbai');
                const data = await response.json();
                results.innerHTML = `✅ Search Success: ${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                results.innerHTML = `❌ Search Failed: ${error.message}`;
            }
        }
    </script>
</body>
</html>
